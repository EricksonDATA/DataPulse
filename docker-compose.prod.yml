# docker-compose.prod.yml — Production-like configuration
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# This file configures DataPulse for production-like deployment with:
# - Secrets via environment variables
# - API authentication enabled
# - Webhook secret enabled
# - Non-development Grafana credentials
# - Persistent PostgreSQL volume
# - Health and readiness checks

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATAPULSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datapulse}
      DATAPULSE_API_KEY: ${DATAPULSE_API_KEY}
      DATAPULSE_WEBHOOK_SECRET: ${DATAPULSE_WEBHOOK_SECRET}
      DATAPULSE_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATAPULSE_ENVIRONMENT: production
    volumes:
      - ./examples/fixtures:/app/examples/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata_prod:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: datapulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATAPULSE_DATABASE_URL: postgresql+psycopg://datapulse:change-me@postgres:5432/datapulse
      DATAPULSE_LOG_LEVEL: INFO
      DATAPULSE_ENVIRONMENT: development
      DATAPULSE_S3_ENDPOINT_URL: http://host.docker.internal:4566
      DATAPULSE_S3_ACCESS_KEY: test
      DATAPULSE_S3_SECRET_KEY: test
      DATAPULSE_S3_REGION: us-east-1
    volumes:
      - ./examples/fixtures:/app/examples/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - api

volumes:
  pgdata:

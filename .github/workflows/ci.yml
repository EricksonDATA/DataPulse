name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint and format ──────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ── Unit and integration tests (SQLite) ─────────────────────
  test-sqlite:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -q --tb=short

      - name: Run integration tests (SQLite)
        run: python -m pytest tests/integration/test_api.py -q --tb=short

  # ── PostgreSQL integration tests ────────────────────────────
  test-postgresql:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: test-ci-password
          POSTGRES_DB: datapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATAPULSE_DATABASE_URL: postgresql+psycopg://datapulse:test-ci-password@localhost:5432/datapulse_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run all tests against PostgreSQL
        run: python -m pytest tests/ -q --tb=short

  # ── Migration upgrade test (empty DB → head) ────────────────
  test-migrations:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: test-ci-password
          POSTGRES_DB: datapulse_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATAPULSE_DATABASE_URL: postgresql+psycopg://datapulse:test-ci-password@localhost:5432/datapulse_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Migrate from empty database
        run: python -m alembic upgrade head

      - name: Verify tables exist
        run: |
          python -c "
          from sqlalchemy import create_engine, inspect
          import os
          engine = create_engine(os.environ['DATAPULSE_DATABASE_URL'])
          tables = sorted(inspect(engine).get_table_names())
          expected = ['alembic_version', 'check_results', 'contracts', 'datasets', 'incidents', 'pipeline_runs', 'pipelines']
          assert tables == expected, f'Tables mismatch: {tables} != {expected}'
          print(f'Migration OK: {len(tables)} tables created')
          "

  # ── CLI smoke test ──────────────────────────────────────────
  test-cli:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: CLI help
        run: datapulse --help

      - name: CLI test
        run: datapulse test
